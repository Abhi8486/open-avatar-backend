default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        # max time a session will last for
        connection_ttl: 900
        concurrent_limit: 5

        output_video_fps: 12  # Must equal AvatarMusetalk.fps for correct A/V sync
        turn_config:
          urls: 
            - "turn:global.relay.metered.ca:80"
            - "turn:global.relay.metered.ca:80?transport=tcp"
            - "turn:global.relay.metered.ca:443"
            - "turns:global.relay.metered.ca:443?transport=tcp"
          username: "8aa37256336b81d19b1b6de6"
          credential: "A9Chbapp7I3ExRaA"
      # === Interrupt Handler - Receives INTERRUPT signal and executes stream cancellation ===
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/webrtcvad/vad_handler_webrtc
        aggressiveness: 1
        padding_duration_ms: 1000
        start_delay: 2048
        end_delay: 16000
        buffer_look_back: 5000
        speech_padding: 512
      SenseVoice:
        enabled: False
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      Sarvam:
        enabled: True
        module: asr/sarvam/asr_handler_sarvam
      EdgeTTS:
        enabled: True
        module: tts/edgetts/tts_handler_edgetts
        voice: "en-US-JennyNeural" # Change voice as needed (e.g., zh-CN-XiaoxiaoNeural)
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "qwen/qwen3.8-27b" # Selected from the list of available models for this API key
        enable_video_input: False
        max_tokens: 75 # Strictly limit output size to keep responses short, snappy, and fast
        history_length: 20
        system_prompt: "You are Doctor Eleanor Vance, a warm, engaging computer science professor tutoring Python programming. Speak naturally like a real human teacher—friendly, encouraging, clear, and conversational. Never mention book titles, curriculum names, system rules, AI, or LLMs. Explain concepts intuitively and invite questions. Keep your responses natural, warm, and limited to 2-3 spoken sentences."
        api_url: "https://api.groq.com/openai/v1"
      AvatarMusetalk:
        module: avatar/musetalk/avatar_handler_musetalk
        fps: 12  # Video frame rate
        batch_size: 8  # Increased from 2 to 8 to massively improve T4 GPU inference throughput and prevent idle frame stuttering
        avatar_video_path: "assets/test_video1.mp4"  # Initialization video path
        avatar_model_dir: "models/musetalk/avatar_model"  # Default avatar model directory
        force_create_avatar: false  # Automatically reuse existing avatar data if present
        debug: true  # Whether to enable debug mode
        multi_thread_inference: true  # Split UNet and VAE into separate threads for pipelined inference
